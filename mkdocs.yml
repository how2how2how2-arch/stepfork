site_name: Stepfork
site_description: Local-first behavioral regression testing for AI agents. Turn a failed agent run into a reproducible pytest regression test.
site_url: https://utsab345.github.io/stepfork/
repo_url: https://github.com/utsab345/stepfork
repo_name: stepfork

theme:
  name: material
  logo: assets/stepfork-logo.png
  favicon: assets/stepfork-logo.png
  palette:
    scheme: default
  features:
    - navigation.instant
    - navigation.expand
    - toc.integrate

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Examples: examples.md
  - Tutorial: tutorials/langgraph-triage.md
  - Real-LLM case study: real-llm-case-study.md
  - Guide:
      - recording.md
      - replay.md
      - hybrid.md
      - diff.md
      - pytest-export.md
      - minimize.md
      - fork.md
      - openai.md
      - langgraph.md
      - trace-format.md
      - cli.md
  - Troubleshooting: troubleshooting.md
  - Community:
      - Early adopter guide: community/early-adopter-guide.md
  - Project:
      - security.md
      - architecture.md
      - integrations.md
      - development.md
      - release-checklist.md
      - pypi-publishing.md
      - releases/v0.2.0.md
      - releases/v0.1.0a6.md
      - releases/v0.1.0a5.md
      - releases/v0.1.0a4.md
      - releases/v0.1.0a3.md
      - releases/v0.1.0a2.md
      - releases/v0.1.0a1.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true

plugins:
  - search
